# 32_09_fpga pixi env (managed by ./fpga-box, see README.md). Pinned by pixi.lock; env in
# ./.pixi, package caches in ./cache. conda-forge: Yosys, Verilator, Icarus Verilog, GTKWave,
# C++ compiler + make for Verilator models, a RISC-V cross GCC for LiteX BIOS/firmware.
# nextpnr (iCE40/ECP5) + icepack/ecppack: YoWASP WebAssembly builds from PyPI (portable, any OS);
# conda-forge has no nextpnr and the litex-hub channel builds need boost 1.73 (unsolvable today).
# LiteX + Migen + data packages from git, pinned to the LiteX 2026.08 release tags.
[workspace]
name = "fpga_box"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"
yosys = "==0.69"
verilator = "==5.052"
iverilog = "*"
gtkwave = "*"
make = "4.*"
cxx-compiler = "*"
c-compiler = "*"
meson = "*"
ninja = "*"
gcc_linux-riscv64 = "*"
zlib = "*"
json-c = "*"        # litex_sim core
libevent = "*"      # litex_sim core
cocotb = "==2.1.0"  # Python testbenches (Icarus/Verilator)
z3-solver = "*"     # SMT solver for yosys-smtbmc (formal BMC / k-induction)


[pypi-dependencies]
amaranth = "==0.5.10"                          # Python HDL (uses the env yosys)
yowasp-nextpnr-ice40 = "==0.11.1.0.post826"   # nextpnr-ice40 + icepack/icetime/icebram
yowasp-nextpnr-ecp5 = "==0.11.1.0.post826"    # nextpnr-ecp5 + ecppack/ecpunpack (prjtrellis)
migen = { git = "https://github.com/m-labs/migen", rev = "e19524c963a8342952840983047557707fbe0b6a" }
litex = { git = "https://github.com/enjoy-digital/litex", rev = "b6ae9e0b227354aecffef5339d3e946f2395ac09" }          # tag 2026.08
litex-boards = { git = "https://github.com/litex-hub/litex-boards", rev = "e4307929c38a7d698c96c9a741af08ab1f2c183d" } # tag 2026.08
pythondata-cpu-vexriscv = { git = "https://github.com/litex-hub/pythondata-cpu-vexriscv", rev = "642ecfed1c84460555d6d803d660cc60cfc1ecb6" }   # 2026.08
pythondata-software-picolibc = { git = "https://github.com/litex-hub/pythondata-software-picolibc", rev = "6a13ccce7c575b32c102dd9dc52178505b81fe39" }   # 2026.08
pythondata-software-compiler_rt = { git = "https://github.com/litex-hub/pythondata-software-compiler_rt", rev = "6eb76609c9627bf26635e57c63fb22cda7115887" }   # 2026.08
# litex_sim imports these (Ethernet/DRAM models, logic analyser core)
liteeth = { git = "https://github.com/enjoy-digital/liteeth", rev = "914853c82db90401ab16f910aee3aef6fc138276" }       # 2026.08
litedram = { git = "https://github.com/enjoy-digital/litedram", rev = "c454a440ca94afd57bca148a0ba2af491325f0e6" }     # 2026.08
litespi = { git = "https://github.com/litex-hub/litespi", rev = "1efda7b0ffe48068239e9a3b559d29c94c83fcf2" }        # 2026.08 (SPI flash for board targets)
litescope = { git = "https://github.com/enjoy-digital/litescope", rev = "807d953bf2f838e0a7af17dcb3c7724e0de2d623" }   # 2026.08
pythondata-misc-tapcfg = { git = "https://github.com/litex-hub/pythondata-misc-tapcfg", rev = "a12c3f592c99f9c082fdc68c065b81cbd6e6b238" }   # litex_sim ethernet/tap module
